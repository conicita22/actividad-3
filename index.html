<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Formulario de Registro</title>
</head>

<body>

    <h1>¡Regístrate y únete a la comunidad!</h1>

    <form>
        <label for="nombre">Nombre:</label>
        <input type="text" id="nombre" name="nombre">
        <br><br>

        <label for="apellido">Apellido:</label>
        <input type="text" id="apellido" name="apellido">
        <br><br>

        <label for="correo">Correo Electrónico:</label>
        <input type="email" id="correo" name="correo">
        <br><br>

        <label for="contrasena">Contraseña:</label>
        <input type="password" id="contrasena" name="contrasena">
        <br><br>

        <label for="confirmar">Confirmar Contraseña:</label>
        <input type="password" id="confirmar" name="confirmar">
        <br><br>

        <label for="fecha">Fecha de Nacimiento:</label>
        <input type="date" id="fecha" name="fecha">
        <br><br>

        <label>Género:</label>
        <input type="radio" name="genero" value="masculino">
        Masculino

        <input type="radio" name="genero" value="femenino">
        Femenino

        <input type="radio" name="genero" value="no-decir">
        Prefiero no decir
        <br><br>

        <input type="checkbox" id="boletin" name="boletin">
        <label for="boletin">Suscríbete a nuestro boletín de noticias</label>
        <br><br>

        <label for="descripcion">Una descripción de mí mismo:</label>
        <br>
        <textarea id="descripcion" name="descripcion"
                  rows="5" cols="30"></textarea>
        <br><br>

        <label for="intereses">Selecciona tus intereses:</label>
        <br>
        <select id="intereses" name="intereses" multiple>
            <option value="musica">Música</option>
            <option value="deportes">Deportes</option>
            <option value="viajes">Viajes</option>
            <option value="tecnologia">Tecnología</option>
        </select>
        <br><br><br>

        <input type="submit" value="¡Registrarse!">

    </form>

</body>
</html>
